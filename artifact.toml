kind = "web"
previewPath = "/"
title = "Multi-Store Inventory & E-commerce System"
version = "1.0.0"
id = "artifacts/inventory-system"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20957

[services.development]
run = "pnpm --filter @workspace/inventory-system run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/inventory-system", "run", "build" ]
publicDir = "artifacts/inventory-system/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20957"
BASE_PATH = "/"
